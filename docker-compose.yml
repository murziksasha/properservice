services:
  next-app:
    build: .
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # false for local HTTP (localhost). Set true behind HTTPS in real production.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-}
      - AUTO_BACKUP=${AUTO_BACKUP:-true}
      - BACKUP_KEEP=${BACKUP_KEEP:-20}
      - BACKUP_CRON_SECRET=${BACKUP_CRON_SECRET:-}
      - SITE_URL=${SITE_URL:-}
      - DATA_DIR=/app/data
      - HOSTNAME=0.0.0.0
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - MAIL_TO=${MAIL_TO:-remontmailshop@gmail.com}
      - MAIL_FROM=${MAIL_FROM:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ADMIN_TOTP_SECRET=${ADMIN_TOTP_SECRET:-}
      - GINCORE_WIDGETS=${GINCORE_WIDGETS:-true}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  php-mailer:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    volumes:
      - ./mailer:/var/www/mailer
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - MAIL_TO=${MAIL_TO:-remontmailshop@gmail.com}
      - MAIL_FROM=${MAIL_FROM:-}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      next-app:
        condition: service_healthy
      php-mailer:
        condition: service_started